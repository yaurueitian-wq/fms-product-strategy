<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="車隊管理產品策略 —— 簡報目錄">
<title>車隊管理產品策略</title>
<style>
:root{{--bg:#080D17;--surface:#111A29;--raised:#19243A;--border:#26344A;
  --text:#F1F5F9;--muted:#A3B2C7;--faint:#7C8DA6;--primary:#60A5FA;--primary-dim:#1E3A5F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"PingFang TC",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --sh:0 1px 3px rgba(0,0,0,.5);
  --sh-lg:0 12px 32px rgba(0,0,0,.6)}}
*{{box-sizing:border-box}}
body{{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:40px 24px}}
main{{width:min(680px,100%)}}
.eyebrow{{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--primary);margin-bottom:9px}}
h1{{font-size:38px;font-weight:690;margin:0 0 12px;letter-spacing:-.03em;line-height:1.15}}
.lede{{margin:0 0 30px;font-size:15px;color:var(--muted);max-width:52ch;line-height:1.65}}
.row{{display:grid;grid-template-columns:34px 1fr 24px;gap:14px;align-items:center;
  padding:16px 18px;margin-bottom:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--sh);text-decoration:none;color:var(--text);
  transition:border-color .18s,box-shadow .18s,transform .18s}}
.row:hover{{border-color:var(--primary);box-shadow:var(--sh-lg);transform:translateY(-1px)}}
.num{{font-family:var(--mono);font-size:15px;color:var(--faint);
  font-variant-numeric:tabular-nums}}
.ch{{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--primary);margin-bottom:3px}}
.ttl{{display:block;font-size:17px;font-weight:640;line-height:1.3}}
.one{{display:block;font-size:12.5px;color:var(--faint);margin-top:3px;line-height:1.5}}
.go{{font-family:var(--mono);font-size:15px;color:var(--border);text-align:right}}
.row:hover .go{{color:var(--primary)}}
.row.tool{{background:var(--raised);box-shadow:none}}
.row.tool .ttl{{font-size:14.5px;color:var(--muted)}}
h2{{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:26px 0 10px;font-weight:600}}
footer{{margin-top:28px;padding-top:18px;border-top:1px solid var(--border);
  font-size:12px;color:var(--faint);line-height:1.7}}
footer code{{font-family:var(--mono);font-size:11.5px;color:var(--muted)}}
:focus-visible{{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}}
@media (prefers-reduced-motion:reduce){{*{{transition:none!important}}}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Demo · 產品策略</div>
  <h1>車隊管理產品策略</h1>
  <p class="lede">從市場地圖推導產品定位。地圖無法保證完全正確 ——
    它的價值在於讓判斷有跡可循：每一條主張都標了來源等級，查無的地方寫查無。</p>
  <h2>簡報</h2>
  {slides}
  <h2>附錄</h2>
  {appx_rows}
  <h2>研究工具　<span style="text-transform:none;letter-spacing:0">↗ 開新分頁</span></h2>
  {tools}
  <footer>
    資料層 <code>市場地圖.md</code>　判斷 <code>觀察筆記.md</code>　來源 <code>參考資料來源.md</code><br>
    規格 <code>SPEC.md</code>　實作 <code>SD.md</code>　原則 <code>設計原則.md</code>
  </footer>
</main>
</body>
</html>
