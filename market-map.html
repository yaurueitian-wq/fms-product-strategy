<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="FMS／TMS／車隊管理市場地圖 —— 節點、連線、族群、應力四種元素的分析工具">
<title>車隊管理市場地圖</title>
<style>
:root{
  --bg:#0B1220; --surface:#131C2B; --raised:#1B2739; --border:#26344A; --hair:#1E2A3D;
  --text:#F1F5F9; --muted:#A3B2C7; --faint:#7C8DA6;
  --primary:#60A5FA; --primary-dim:#1E3A5F; --accent:#FB923C;
  --obj:#38BDF8; --ppl:#A78BFA; --org:#60A5FA; --sys:#34D399; --cap:#94A3B8;
  --vD:#60A5FA; --vC:#34D399; --vI:#FB923C; --vM:#F87171; --vV:#A78BFA;
  --edge:#64748B;
  --ok:#34D399; --warn:#FBBF24; --bad:#F87171;
  --z-hud:10; --z-panel:20; --z-tip:30; --z-modal:50;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,"PingFang TC",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --r:6px; --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-lg:0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.skip{position:absolute;left:-9999px;top:0;background:var(--primary);color:#fff;
  padding:10px 16px;border-radius:var(--r);z-index:var(--z-modal)}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}

/* ── 頂欄 ── */
.top{position:sticky;top:0;z-index:var(--z-panel);background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:var(--sh)}
.top-in{max-width:1600px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.brand .ver{font-family:var(--mono);font-size:11px;color:var(--faint);
  background:var(--raised);padding:2px 7px;border-radius:20px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}
.kpi{background:var(--raised);border:1px solid var(--border);border-radius:var(--r);
  padding:5px 11px;min-width:74px}
.kpi .val{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.15;
  font-variant-numeric:tabular-nums;display:block}
.kpi .k{font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.kpi.hl .v{color:var(--primary)}
.kpi.warn .v{color:var(--warn)}

/* ── 版面 ── */
.shell{max-width:1600px;margin:0 auto;padding:16px 20px 64px;
  display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.rail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.sec{padding:13px 14px;border-bottom:1px solid var(--hair)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.sec-h h2{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:0}
.sec-h .hint{font-size:10.5px;color:var(--faint)}
.search{width:100%;padding:7px 10px;font-family:var(--sans);font-size:13px;color:var(--text);
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r)}
.search::placeholder{color:var(--faint)}

.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;font-family:var(--sans);
  font-size:12.5px;color:var(--text);background:none;border:none;border-radius:5px;
  cursor:pointer;text-align:left;transition:background .15s}
.chip:hover{background:var(--raised)}
.chip[aria-pressed="false"]{color:var(--faint)}
.chip[aria-pressed="false"] .dot,.chip[aria-pressed="false"] .ln{opacity:.25}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.ln{width:20px;height:0;border-top-width:2.5px;flex:0 0 20px}
.chip .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}

.grow{display:flex;flex-direction:column;gap:2px}
.gitem{display:flex;align-items:baseline;gap:8px;width:100%;padding:6px 7px;font-family:var(--sans);
  font-size:12.5px;color:var(--text);background:none;border:none;border-radius:5px;cursor:pointer;
  text-align:left;transition:background .15s}
.gitem:hover{background:var(--raised)}
.steps{display:flex;flex-direction:column;gap:1px}
.step{display:grid;grid-template-columns:8px 1fr;gap:9px;align-items:center;padding:5px 6px;
  border-radius:5px;font-size:11.5px;color:var(--faint);cursor:pointer;background:none;
  border:none;font-family:inherit;text-align:left;width:100%;
  transition:background .15s,color .15s}
.step:hover{background:var(--raised);color:var(--muted)}
.step .pip{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .15s}
.step.on{color:var(--text);background:var(--primary-dim)}
.step.on .pip{background:var(--primary)}
.step .d{display:block;font-size:10.5px;opacity:.8;font-weight:400}
.gitem.on{background:var(--primary-dim);box-shadow:inset 2px 0 0 var(--primary)}
.gitem .c{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 20px}
.gitem .w{font-family:var(--mono);font-size:9.5px;color:var(--accent);margin-left:auto;white-space:nowrap}
.glabel{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:6px;margin:9px 0 4px}
.glabel .bar{width:12px;height:3px;border-radius:2px}
.glabel .role{margin-left:auto;font-size:9.5px}

/* ── 主區 ── */
.tabs{display:flex;gap:2px;padding:9px 12px 0;border-bottom:1px solid var(--border)}
.tab{padding:8px 14px;font-size:13px;font-weight:550;color:var(--muted);background:none;
  border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;
  display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .bdg{font-family:var(--mono);font-size:10px;background:var(--raised);padding:1px 6px;border-radius:20px;color:var(--faint)}

.view{display:none}
.view.on{display:block}
.canvas-wrap{position:relative;height:min(72vh,720px)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.hud{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10.5px;
  color:var(--faint);background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--border);border-radius:var(--r);padding:6px 9px;line-height:1.5;
  text-align:right;pointer-events:none;z-index:var(--z-hud)}
.hud b{color:var(--muted);font-weight:600}
.legend{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:4px 13px;
  font-size:10.5px;color:var(--faint);background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;pointer-events:none;z-index:var(--z-hud)}
.lg{display:flex;align-items:center;gap:5px}
.lg .cir{width:8px;height:8px;border-radius:50%}
.lg .cir.hollow{background:none!important;border:1.3px dashed var(--faint)}
.lg .cir.ring{background:none!important;border:2px solid var(--accent)}
.banner{position:absolute;left:12px;top:12px;right:120px;padding:9px 13px;background:var(--surface);
  border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r);
  font-size:12.5px;display:none;align-items:center;gap:10px;box-shadow:var(--sh-lg);z-index:var(--z-hud)}
.banner.on{display:flex}
.banner b{font-weight:650}
.banner .sp{color:var(--muted);font-size:11.5px}
.banner button{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--raised);
  border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:5px;cursor:pointer;flex:0 0 auto}
.banner button:hover{background:var(--primary-dim);color:var(--primary)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--sh-lg);padding:9px 12px;max-width:260px;font-size:12.5px;
  line-height:1.5;opacity:0;transition:opacity .12s;z-index:var(--z-tip)}
.tip .id{font-family:var(--mono);font-size:10px;color:var(--primary)}
.tip .nm{font-weight:650;display:block;margin:2px 0 4px}
.tip .ds{color:var(--muted);font-size:12px}
.tip .mt{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px;display:block}

/* ── 鄰接表 ── */
.adj{padding:12px 14px;max-height:min(72vh,720px);overflow:auto}
.adj-note{background:var(--raised);border:1px solid var(--border);border-radius:var(--r);
  padding:9px 12px;font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.adj-note svg{width:15px;height:15px;flex:0 0 15px;margin-top:2px;stroke:var(--accent);fill:none;stroke-width:1.9}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:10.5px;
  font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--raised)}
.tbl tbody tr{cursor:pointer}
.vb{font-family:var(--mono);font-size:11px;font-weight:650;padding:1px 6px;border-radius:4px;
  border:1px solid currentColor;white-space:nowrap}
.mono{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.rd{color:var(--muted);font-size:12px;display:block;margin-top:2px}

/* ── 詳情 ── */
.detail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding:15px 16px}
.empty{color:var(--faint);font-size:13px;line-height:1.7}
.empty b{color:var(--muted)}
.d-id{font-family:var(--mono);font-size:11px;color:var(--primary);letter-spacing:.05em}
.d-nm{font-size:19px;font-weight:650;margin:3px 0 6px;line-height:1.3}
.d-ds{font-size:13.5px;color:var(--muted);margin:0 0 13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border:1px solid var(--border);
  color:var(--muted);border-radius:20px}
.tag.p{border-color:var(--primary);color:var(--primary)}
.tag.a{border-color:var(--accent);color:var(--accent)}
.tag.b{border-color:var(--bad);color:var(--bad)}
.sub{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:14px 0 7px}
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:baseline;font-size:12.5px;
  padding:7px;border-radius:5px;background:none;border:none;width:100%;text-align:left;
  color:var(--text);font-family:var(--sans);cursor:pointer;transition:background .12s}
.row:hover{background:var(--raised)}
.row .ar{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.row .to{font-weight:550}
.row .nt{display:block;color:var(--faint);font-size:11.5px;margin-top:1px}
.ta{border:1px solid var(--border);background:var(--raised);border-radius:var(--r);padding:12px 13px;margin-bottom:14px}
.ta-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--primary);margin-bottom:8px}
.ta-r{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:12.5px;margin-bottom:4px;align-items:baseline}
.ta-r span:first-child{color:var(--faint);font-family:var(--mono);font-size:10px}
.ta-r .gap{color:var(--bad)}
.ta p{margin:7px 0 0;font-size:12px;color:var(--muted);line-height:1.55}
.ta p b{color:var(--text)}
.lv{font-family:var(--mono);font-size:9px;padding:0 4px;border-radius:3px;border:1px solid currentColor}
.lv.v{color:var(--ok)} .lv.e{color:var(--warn)} .lv.n{color:var(--bad)}

footer{max-width:1600px;margin:0 auto;padding:20px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

@media (max-width:1280px){.shell{grid-template-columns:230px minmax(0,1fr)}
  .detail{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:820px){.shell{grid-template-columns:1fr;padding:12px}
  .rail{position:static;max-height:none}.canvas-wrap{height:460px}
  .legend{position:static;margin:8px 12px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要內容</a>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>車隊管理市場地圖</h1>
      <span class="ver" id="ver">v2.3</span>
    </div>
    <div class="kpis">
      <div class="kpi"><span class="val" id="kpi-nodes">—</span><span class="k">節點</span></div>
      <div class="kpi"><span class="val" id="kpi-edges">—</span><span class="k">連線</span></div>
      <div class="kpi"><span class="val" id="kpi-groups">—</span><span class="k">族群</span></div>
      <div class="kpi"><span class="val" id="kpi-stress">—</span><span class="k">應力</span></div>
      <div class="kpi hl"><span class="v" id="kpi-note">—</span><span class="k">讀法覆蓋</span></div>
      <div class="kpi hl"><span class="v" id="kpi-shown">—</span><span class="k">顯示中</span></div>
      <div class="kpi warn"><span class="v" id="kpi-weak">—</span><span class="k">待補連線</span></div>
    </div>
  </div>
</header>

<div class="shell">

  <aside class="panel rail" aria-label="篩選器">
    <div class="sec">
      <div class="sec-h"><h2>縮放層級</h2><span class="hint">點著跳</span></div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>搜尋</h2></div>
      <label for="q" class="sr-only" style="position:absolute;left:-9999px">搜尋節點</label>
      <input class="search" id="q" type="search" placeholder="節點名稱或 ID…">
    </div>
    <div class="sec">
      <div class="sec-h"><h2>族群</h2><span class="hint">點一個來篩</span></div>
      <div class="grow" id="groups"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>節點性質</h2></div>
      <div class="chips" id="natures"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>連結動詞</h2><span class="hint">皆有方向</span></div>
      <div class="chips" id="verbs"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>應力</h2><span class="hint">壓在誰身上</span></div>
      <div class="grow" id="stresses"></div>
    </div>
  </aside>

  <main class="panel" id="main">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-graph" role="tab" aria-selected="true" aria-controls="v-graph">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="10" r="2.4"/><circle cx="9" cy="19" r="2.4"/><path d="M7.2 7.1 16.8 9M6.2 8.2 8 16.7M17.6 12l-7 5.6"/></svg>
        網絡圖
      </button>
      <button class="tab" id="tab-adj" role="tab" aria-selected="false" aria-controls="v-adj">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        鄰接表<span class="bdg" id="adj-n">—</span>
      </button>
    </div>

    <section class="view on" id="v-graph" role="tabpanel" aria-labelledby="tab-graph">
      <div class="canvas-wrap" id="cwrap">
        <canvas id="cv" aria-label="節點網絡圖。無法使用滑鼠時請切換到鄰接表分頁。"></canvas>
        <div class="banner" id="banner"></div>
        <div class="hud" id="hud"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <section class="view" id="v-adj" role="tabpanel" aria-labelledby="tab-adj">
      <div class="adj">
        <div class="adj-note">
          <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span><b>網絡圖的無障礙評等是「很差」</b> —— 需要滑鼠、需要視覺、密集時讀不了。這張鄰接表是等價的替代檢視：同樣的資料，可搜尋、可鍵盤操作、可複製。點任一列會跳到該節點。</span>
        </div>
        <table class="tbl">
          <thead><tr><th>起點</th><th>關係</th><th>終點</th><th>讀法</th></tr></thead>
          <tbody id="adj-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <aside class="panel detail" id="detail" aria-live="polite"></aside>
</div>

<footer>
  <span>資料層 <code>市場地圖.md</code>　·　判斷 <code>觀察筆記.md</code>　·　規格 <code>SPEC.md</code>　·　實作 <code>SD.md</code></span>
  <span id="foot-stat"></span>

    while(st.length){const id=st.pop();c.push(id);
      for(const m of adj.get(id))if(!seen.has(m)){seen.add(m);st.push(m);}}comps.push(c);}
  comps.sort((a,b)=>b.length-a.length);
  let ring=0,idx=0,per=1,rr=0;
  comps.forEach((c,ci)=>{
    if(ci===0){rr=0;per=1;}else if(idx>=per){ring++;idx=0;per=Math.max(4,ring*5);rr=520+ring*300;}
    const ang=(idx/per)*Math.PI*2+ci*0.7,cx=Math.cos(ang)*rr,cy=Math.sin(ang)*rr,sp=40+Math.sqrt(c.length)*38;
    c.forEach((id,k)=>{const nd=byId.get(id);const a=(k/c.length)*Math.PI*2*3.2,r=sp*Math.sqrt((k+1)/c.length);
      nd.x=cx+Math.cos(a)*r;nd.y=cy+Math.sin(a)*r;});idx++;});
})();

const cv=$("cv"),ctx=cv.getContext("2d"),wrap=$("cwrap");
let W=0,H=0,DPR=1,css=getComputedStyle(document.documentElement),drag=null,pan=null,moved=false;
const c=v=>css.getPropertyValue(v).trim();
const view={x:0,y:0,s:1};
const R=n=>3.4+Math.min(9,Math.sqrt(n.deg)*2.1);
const SX=n=>n.x*view.s+view.x, SY=n=>n.y*view.s+view.y;

function tick(temp){
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<4){d2=4;dx=(i%7-3)/7;dy=(j%5-2)/5;}
      const d=Math.sqrt(d2),rep=2600*(1+Math.sqrt(a.deg*b.deg)*.55)/d2;
      const fx=dx/d*rep,fy=dy/d*rep;a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;}}
  for(const e of edges){const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.max(1,Math.hypot(dx,dy));
    const L=96+Math.sqrt(Math.max(e.s.deg,e.t.deg))*17,f=(d-L)*.0068;
    const fx=dx/d*f,fy=dy/d*f;e.s.vx+=fx;e.s.vy+=fy;e.t.vx-=fx;e.t.vy-=fy;}
  for(const n of nodes){n.vx-=n.x*.00055;n.vy-=n.y*.00055;n.vx*=.85;n.vy*=.85;
    const sp=Math.hypot(n.vx,n.vy);if(sp>temp){n.vx=n.vx/sp*temp;n.vy=n.vy/sp*temp;}
    if(n!==drag){n.x+=n.vx;n.y+=n.vy;}}
}
const vis=n=>{
  if(!actNat.has(n.nature)&&!PINNED.has(n.id))return false;
  if(q&&!(n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)))return false;
  return true;
};
function fit(ids){
  if(userMoved)return;
  const set=(ids?ids.map(i=>byId.get(i)).filter(Boolean):nodes.filter(vis));
  const use=set.length?set:nodes;
  let a=1e9,b=-1e9,cc=1e9,d=-1e9;
  for(const n of use){a=Math.min(a,n.x);b=Math.max(b,n.x);cc=Math.min(cc,n.y);d=Math.max(d,n.y);}
  const pad=ids?110:64;
  view.s=Math.min((W-pad*2)/Math.max(60,b-a),(H-pad*2)/Math.max(60,d-cc),2.4);
  view.x=W/2-(a+b)/2*view.s;view.y=H/2-(cc+d)/2*view.s;
}
function resize(){
  const r=wrap.getBoundingClientRect();
  DPR=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(360,r.height);
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);draw();
}
function draw(){
  css=getComputedStyle(document.documentElement);
  ctx.clearRect(0,0,W,H);
  const gs=actG?new Set(byG.get(actG).on):null, gc=actG?GK[byG.get(actG).kind].c:null;
  const fs=actF?new Set(byF.get(actF).on):null;
  const focus=sel||hov, nbr=new Set();
  if(focus){nbr.add(focus.id);for(const e of edges){if(e.s===focus)nbr.add(e.t.id);if(e.t===focus)nbr.add(e.s.id);}}

  for(const e of edges){
    const ev=actVerb.has(e.v)&&vis(e.s)&&vis(e.t);
    const touch=focus&&(e.s===focus||e.t===focus);
    if(!ev&&!touch)continue;
    let al=touch?.95:(focus?.07:(view.s<.5?.28:.5));
    if(gs&&!touch)al=(gs.has(e.s.id)&&gs.has(e.t.id))?.9:.08;
    if(fs&&!touch)al=(fs.has(e.s.id)&&fs.has(e.t.id))?.8:.08;
    const m=VERB[e.v];
    ctx.strokeStyle=al>.5?c(m.c):c("--edge");ctx.setLineDash(m.d);
    ctx.lineWidth=touch?2:1.2;ctx.globalAlpha=al;
    const x1=SX(e.s),y1=SY(e.s),x2=SX(e.t),y2=SY(e.t);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(view.s>=.62&&al>.3){
      const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);
      if(L>18){const ux=dx/L,uy=dy/L,bk=R(e.t)+3.5,ax=x2-ux*bk,ay=y2-uy*bk,sz=Math.min(8,4.5+view.s*1.8);
        ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(ax,ay);

        ctx.lineTo(ax-ux*sz+uy*sz*.42,ay-uy*sz-ux*sz*.42);

    }
  }
  ctx.setLineDash([]);ctx.globalAlpha=1;

  const shown=nodes.filter(vis).sort((a,b)=>b.deg-a.deg);
  for(const n of shown){
    const inG=gs?gs.has(n.id):true, inF=fs?fs.has(n.id):true, inN=focus?nbr.has(n.id):true;
    const X=SX(n),Y=SY(n),r=R(n),weak=n.deg===0;
    ctx.globalAlpha=(!inG?.16:(!inF?.18:(!inN?.20:1)));
    if(gs&&inG){ctx.beginPath();ctx.arc(X,Y,r+7,0,6.2832);
      ctx.fillStyle=c(gc);ctx.globalAlpha=.15;ctx.fill();ctx.globalAlpha=1;}
    if(fs&&inF){ctx.beginPath();ctx.arc(X,Y,r+5,0,6.2832);
      ctx.strokeStyle=c(FT[byF.get(actF).type].c);ctx.lineWidth=2;ctx.stroke();}
    ctx.beginPath();ctx.arc(X,Y,r,0,6.2832);
    if(weak){ctx.fillStyle=c("--surface");ctx.fill();
      ctx.setLineDash([2.5,2.5]);ctx.strokeStyle=c("--faint");ctx.lineWidth=1.3;ctx.stroke();
      ctx.setLineDash([]);}
    else{ctx.fillStyle=n===sel?c("--accent"):c(NAT[n.nature].c);ctx.fill();}
    if(n===sel){
      ctx.beginPath();ctx.arc(X,Y,r+9,0,6.2832);
      ctx.fillStyle=c("--accent");ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(X,Y,r+5,0,6.2832);
      ctx.strokeStyle=c("--accent");ctx.lineWidth=2;ctx.stroke();
    }
    if(PINNED.has(n.id)){ctx.strokeStyle=c("--text");ctx.lineWidth=1.6;ctx.globalAlpha=.8;
      ctx.beginPath();ctx.arc(X,Y,r+3.5,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}
  }
  ctx.globalAlpha=1;                             // 節點迴圈逐個設過透明度，畫字前必須還原
  ctx.textAlign="left";ctx.textBaseline="middle";
  const boxes=[],minD=view.s<.45?5:view.s<.8?3:view.s<1.3?1:0;
  const FX=focus?SX(focus):0, FY=focus?SY(focus):0;
  for(const n of shown){
    if(n===focus)continue;                       // 焦點自己最後畫，才不會被別人蓋掉
    const inG=gs?gs.has(n.id):true, inF=fs?fs.has(n.id):true;
    if(!inG||!inF)continue;
    if(focus&&!nbr.has(n.id))continue;
    if(!gs&&!fs&&!focus&&!q&&n.deg<minD&&!PINNED.has(n.id))continue;
    const X=SX(n),Y=SY(n),r=R(n);
    ctx.font=`500 11.5px ${c("--sans")||"sans-serif"}`;
    const lbl=n.label.length>13?n.label.slice(0,12)+"…":n.label;
    const w=ctx.measureText(lbl).width;
    // 聚焦時往遠離焦點的那一側放，讓標籤跟著輻射方向散開
    const outward=focus?(X>=FX):true;

  if(focus){                                     // 焦點：置中在節點正上方，大一級，永遠畫得出來
    const X=SX(focus),Y=SY(focus),r=R(focus);

  $("hud").innerHTML=`縮放 <b>${(z*100).toFixed(0)}%</b>　·　${z<.45?"只標樞紐":z<.8?"標主要":z<1.3?"標多數":"全部標名"}　·　${z>=.62?"箭頭已顯示":"放大看箭頭"}<br>`+
    `<span style="opacity:.7">滾輪縮放　拖曳平移　雙擊全覽</span>`;
  const k=lodOf(z);
  $("steps").querySelectorAll("[data-lod]").forEach(b=>
    b.classList.toggle("on",+b.dataset.lod===k));
}

const LOD=[

  const mx=ev.clientX-r.left,my=ev.clientY-r.top;
  if(pan){view.x=pan.vx+(mx-pan.x);view.y=pan.vy+(my-pan.y);moved=true;userMoved=true;draw();return;}
  if(drag){moved=true;drag.x=(mx-view.x)/view.s;drag.y=(my-view.y)/view.s;drag.vx=drag.vy=0;draw();return;}
  const h=pick(mx,my);if(h!==hov){hov=h;cv.style.cursor=h?"pointer":"grab";draw();}});
cv.addEventListener("pointerup",()=>{
  if(drag&&!moved){sel=drag;detailNode(sel);}
  else if(!drag&&!moved&&!pan){sel=null;detailEmpty();}
  drag=null;pan=null;draw();});
cv.addEventListener("pointerleave",()=>{hov=null;draw();});
addEventListener("resize",resize);

// ── 啟動 ──
resize();
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const iters=900,temp=i=>Math.max(1.2,14*(1-i/iters));
if(reduce){for(let i=0;i<iters;i++)tick(temp(i));fit();draw();detailEmpty();sync();}
else{let i=0;(function loop(){const b=i<200?6:3;
  for(let k=0;k<b&&i<iters;k++,i++)tick(temp(i));
  if(i%12<b){fit(actG?byG.get(actG).on:null);draw();}
  if(i<iters)requestAnimationFrame(loop);else{fit();draw();detailEmpty();sync();}})();}
detailEmpty();
sync();
renderAdj();
})();
</script>
</body>
